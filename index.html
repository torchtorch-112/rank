<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微博投票实时监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 12px 0 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 700;
            color: #c9d1d9;
            letter-spacing: 0.5px;
        }
        .header h1 span { color: #2ECC71; }
        .status {
            font-size: 12px;
            color: #8b949e;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .status button:hover { background: #30363d; }
        .status button:disabled { opacity: 0.5; cursor: default; }
        #chart {
            flex: 2;
            width: 100%;
            min-height: 300px;
        }
        #gap-chart {
            flex: 1;
            width: 100%;
            min-height: 180px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>微博投票 · <span>实时票数追踪</span></h1>
        <div class="status">
            <span id="update-time">加载中...</span>
            <button id="refresh-btn" type="button">刷新</button>
        </div>
    </div>
    <div id="chart"></div>
    <div id="gap-chart"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });
        const gapChart = echarts.init(document.getElementById('gap-chart'), null, { renderer: 'canvas' });

        const COLORS = {
            "十个勤天": "#A29BFE",
            "苏新皓":   "#FF6B6B",
            "朱志鑫":   "#FFD93D",
            "张泽禹":   "#2ECC71"
        };
        const ORDER = ["十个勤天", "苏新皓", "朱志鑫", "张泽禹"];

        const REFRESH_INTERVAL = 1 * 60 * 1000;          // 1 分钟轮询一次
        const HOURS_18 = 18 * 60 * 60 * 1000;            // ★ 只显示最近 18 小时
        let pollTimer = null;
        let lastTime = null;                             // 上一次渲染的数据时间戳

        function formatVote(v) {
            if (v === null || v === undefined) return '-';
            if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(1) + '亿';
            if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + '万';
            return v.toLocaleString();
        }

        // "2024-05-01 12:30" -> 时间戳（按本地时区解析）
        function parseTime(t) {
            if (t === null || t === undefined) return null;
            const ms = new Date(String(t).replace(' ', 'T')).getTime();
            return isNaN(ms) ? null : ms;
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        function formatTimeLabel(ts, withDate) {
            const d = new Date(ts);
            const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
            if (!withDate) return hm;
            return (d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm;
        }

        function renderChart(data) {
            const rawSeries = data.series || {};
            let timestamps = (data.times || []).map(parseTime);
            let seriesData = rawSeries;

            // ---------- 1. 找到最后一个有效时间戳，作为窗口右边界 ----------
            let endTs = null;
            for (let i = timestamps.length - 1; i >= 0; i--) {
                if (timestamps[i] !== null) { endTs = timestamps[i]; break; }
            }

            let axisMin = null, axisMax = null;

            if (endTs !== null) {
                axisMax = endTs;
                axisMin = endTs - HOURS_18;
                const cutoff = axisMin;

                // 裁剪到最近 18 小时内的数据
                let startIndex = -1;
                for (let i = 0; i < timestamps.length; i++) {
                    if (timestamps[i] !== null && timestamps[i] >= cutoff) {
                        startIndex = i;
                        break;
                    }
                }
                if (startIndex < 0) startIndex = 0;
                if (startIndex > 0) {
                    timestamps = timestamps.slice(startIndex);
                    const ns = {};
                    for (const name in rawSeries) {
                        ns[name] = rawSeries[name].slice(startIndex);
                    }
                    seriesData = ns;
                }
            }

            // ---------- 2. 横轴标签是否需要带日期 ----------
            const showDate = (axisMin != null && axisMax != null) &&
                new Date(axisMin).toDateString() !== new Date(axisMax).toDateString();

            // ---------- 3. 组装主图 series（[时间戳, 票数] 形式） ----------
            const seriesNames = ORDER.filter(n => seriesData[n]);
            Object.keys(seriesData).forEach(n => {
                if (!seriesNames.includes(n)) seriesNames.push(n);
            });

            const series = seriesNames.map(name => {
                const values = seriesData[name] || [];
                const pts = [];
                for (let i = 0; i < timestamps.length; i++) {
                    const ts = timestamps[i];
                    if (ts === null) continue;
                    const v = values[i];
                    pts.push([ts, (v === null || v === undefined || v === '') ? null : v]);
                }
                const color = COLORS[name] || '#4ECDC4';
                return {
                    name: name,
                    type: 'line',
                    smooth: true,
                    symbol: 'none',
                    connectNulls: false,
                    lineStyle: {
                        width: 2.5,
                        color: color,
                        shadowColor: color,
                        shadowBlur: 10
                    },
                    itemStyle: { color: color },
                    emphasis: { focus: 'series' },
                    data: pts
                };
            });

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    axisPointer: { type: 'line', lineStyle: { color: '#30363d' } },
                    formatter: function (params) {
                        if (!params || !params.length) return '';
                        const ts = params[0].axisValue;
                        let html = '<div style="font-size:12px;color:#8b949e">' +
                                   formatTimeLabel(ts, true) + '</div>';
                        params.forEach(p => {
                            const v = Array.isArray(p.value) ? p.value[1] : p.value;
                            html += `<div style="margin-top:4px">
                                <span style="display:inline-block;width:8px;height:8px;
                                border-radius:50%;background:${p.color};
                                margin-right:6px;"></span>
                                ${p.seriesName}: <b>${formatVote(v)}</b>
                            </div>`;
                        });
                        return html;
                    }
                },
                legend: {
                    data: seriesNames,
                    textStyle: { color: '#c9d1d9', fontSize: 12 },
                    top: 0,
                    icon: 'circle'
                },
                grid: {
                    left: '8%',
                    right: '5%',
                    bottom: '10%',
                    top: 50,
                    containLabel: true
                },
                xAxis: {
                    type: 'time',
                    min: axisMin,
                    max: axisMax,
                    boundaryGap: false,
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        hideOverlap: true,
                        formatter: function (value) {
                            return formatTimeLabel(value, showDate);
                        }
                    },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisTick: { show: false },
                    splitLine: { show: false }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        formatter: formatVote
                    },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: {
                        lineStyle: { color: '#30363d', type: 'dashed' }
                    }
                },
                series: series,
                animationDuration: 500
            };

            myChart.setOption(option, true);

            // ---------- 4. 差距图：苏新皓 - 朱志鑫 ----------
            const suArr  = seriesData['苏新皓'] || [];
            const zhuArr = seriesData['朱志鑫'] || [];
            const gapData = [];

            for (let i = 0; i < timestamps.length; i++) {
                const ts = timestamps[i];
                if (ts === null) continue;

                const sv = suArr[i];
                const zv = zhuArr[i];

                if (sv === null || sv === undefined || sv === '' ||
                    zv === null || zv === undefined || zv === '') {
                    gapData.push([ts, null]);
                } else {
                    gapData.push([ts, Number(sv) - Number(zv)]);
                }
            }

            const gapOption = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    axisPointer: { type: 'line', lineStyle: { color: '#30363d' } },
                    formatter: function (params) {
                        if (!params || !params.length) return '';
                        const p = params[0];
                        const ts = p.axisValue;
                        const diff = Array.isArray(p.value) ? p.value[1] : p.value;
                        return `<div style="font-size:12px;color:#8b949e">${formatTimeLabel(ts, true)}</div>
                                <div style="margin-top:4px">苏新皓 - 朱志鑫：<b>${formatVote(diff)}</b></div>`;
                    }
                },
                grid: { left: '8%', right: '5%', bottom: '12%', top: 20, containLabel: true },
                xAxis: {
                    type: 'time',
                    min: axisMin,
                    max: axisMax,
                    boundaryGap: false,
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        hideOverlap: true,
                        formatter: function (value) {
                            return formatTimeLabel(value, showDate);
                        }
                    },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisTick: { show: false },
                    splitLine: { show: false }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        formatter: function (v) { return formatVote(v); }
                    },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: { lineStyle: { color: '#30363d', type: 'dashed' } }
                },
                series: [{
                    name: '苏新皓 - 朱志鑫',
                    type: 'line',
                    smooth: true,
                    symbol: 'none',
                    connectNulls: false,
                    lineStyle: { width: 2.5, color: '#FF6B6B' },
                    itemStyle: { color: '#FF6B6B' },
                    areaStyle: { color: 'rgba(255,107,107,0.08)' },
                    markLine: {
                        symbol: 'none',
                        silent: true,
                        lineStyle: { color: '#8b949e', type: 'dashed', width: 1 },
                        data: [{ yAxis: 0 }]
                    },
                    data: gapData
                }],
                animationDuration: 500
            };

            gapChart.setOption(gapOption, true);
        }

        function setStatus(text) {
            document.getElementById('update-time').innerText = text;
        }

        function loadData(isManual) {
            const btn = document.getElementById('refresh-btn');
            if (isManual) btn.disabled = true;

            // no-cache: 浏览器会发条件请求，文件没变则返回 304，不传正文
            return fetch('cloud_data.json', { cache: 'no-cache' })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    const last = data.times[data.times.length - 1] || '无数据';

                    // 数据没变，跳过重绘
                    if (last === lastTime) {
                        setStatus('最后更新：' + last);
                        return;
                    }

                    lastTime = last;
                    setStatus('最后更新：' + last);
                    renderChart(data);
                })
                .catch(err => {
                    console.error('加载失败:', err);
                    // 只有从未成功加载过时才提示错误；已有数据则静默忽略本次失败
                    if (lastTime === null) {
                        setStatus('数据加载失败：' + err.message);
                    }
                })
                .finally(() => {
                    if (isManual) btn.disabled = false;
                });
        }

        // 递归 setTimeout，配合可见性判断
        function scheduleNext() {
            clearTimeout(pollTimer);
            if (document.hidden) return;              // 后台不排下一轮
            pollTimer = setTimeout(async () => {
                await loadData(false);
                scheduleNext();
            }, REFRESH_INTERVAL);
        }

        // 页面切回前台：立即拉一次并重新排程
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadData(false).finally(scheduleNext);
            } else {
                clearTimeout(pollTimer);
            }
        });

        // 手动刷新
        document.getElementById('refresh-btn').addEventListener('click', () => {
            loadData(true).finally(() => {
                clearTimeout(pollTimer);
                scheduleNext();
            });
        });

        // 首屏加载
        loadData(false).finally(scheduleNext);

        window.addEventListener('resize', () => {
            myChart.resize();
            gapChart.resize();
        });
    </script>
</body>
</html>
