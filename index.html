<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微博投票实时监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 12px 0 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 700;
            color: #c9d1d9;
            letter-spacing: 0.5px;
        }
        .header h1 span { color: #2ECC71; }
        .status {
            font-size: 12px;
            color: #8b949e;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .status button:hover { background: #30363d; }
        .status button:disabled { opacity: 0.5; cursor: default; }
        #chart {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>微博投票 · <span>实时票数追踪</span></h1>
        <div class="status">
            <span id="update-time">加载中...</span>
            <button id="refresh-btn" type="button">刷新</button>
        </div>
    </div>
    <div id="chart"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

        const COLORS = {
            "十个勤天": "#A29BFE",
            "苏新皓":   "#FF6B6B",
            "朱志鑫":   "#FFD93D",
            "张泽禹":   "#2ECC71"
        };
        const ORDER = ["十个勤天", "苏新皓", "朱志鑫", "张泽禹"];

        const REFRESH_INTERVAL = 1 * 60 * 1000;   // 1 分钟
        let pollTimer = null;
        let lastTime = null;                       // 上一次渲染的数据时间戳

        function formatVote(v) {
            if (v === null || v === undefined) return '-';
            if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(1) + '亿';
            if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + '万';
            return v.toLocaleString();
        }

        function renderChart(data) {
            // --- 只显示最近18小时的数据 ---
            const HOURS_18 = 18 * 60 * 60 * 1000;
            const parseTime = (t) => new Date(String(t).replace(' ', 'T')).getTime();
            let times = data.times;
            let seriesData = data.series;
            if (times && times.length > 0) {
                const lastTimestamp = parseTime(times[times.length - 1]);
                const cutoff = lastTimestamp - HOURS_18;
                let startIndex = 0;
                for (let i = 0; i < times.length; i++) {
                    if (parseTime(times[i]) >= cutoff) {
                        startIndex = i;
                        break;
                    }
                }
                if (startIndex > 0) {
                    times = times.slice(startIndex);
                    const newSeries = {};
                    for (const name in seriesData) {
                        newSeries[name] = seriesData[name].slice(startIndex);
                    }
                    seriesData = newSeries;
                }
            }
            // --- 结束 ---

            const timesFormatted = times.map(t => String(t).substring(11, 16));

            const seriesNames = ORDER.filter(n => seriesData[n]);
            Object.keys(seriesData).forEach(n => {
                if (!seriesNames.includes(n)) seriesNames.push(n);
            });

            const series = seriesNames.map(name => ({
                name: name,
                type: 'line',
                smooth: true,
                symbol: 'none',
                connectNulls: false,
                lineStyle: {
                    width: 2.5,
                    color: COLORS[name] || '#4ECDC4',
                    shadowColor: COLORS[name] || '#4ECDC4',
                    shadowBlur: 10
                },
                itemStyle: { color: COLORS[name] || '#4ECDC4' },
                emphasis: { focus: 'series' },
                data: seriesData[name]
            }));

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    formatter: function (params) {
                        let html = '<div style="font-size:12px">' + params[0].axisValue + '</div>';
                        params.forEach(p => {
                            html += `<div style="margin-top:4px">
                                <span style="display:inline-block;width:8px;height:8px;
                                border-radius:50%;background:${p.color};
                                margin-right:6px;"></span>
                                ${p.seriesName}: <b>${formatVote(p.value)}</b>
                            </div>`;
                        });
                        return html;
                    }
                },
                legend: {
                    data: seriesNames,
                    textStyle: { color: '#c9d1d9', fontSize: 12 },
                    top: 0,
                    icon: 'circle'
                },
                grid: {
                    left: '8%',
                    right: '5%',
                    bottom: '10%',
                    top: 50,
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: timesFormatted,
                    axisLabel: { color: '#8b949e', fontSize: 10 },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisTick: { show: false }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        formatter: formatVote
                    },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: {
                        lineStyle: { color: '#30363d', type: 'dashed' }
                    }
                },
                series: series,
                animationDuration: 500
            };

            myChart.setOption(option, true);
        }

        function setStatus(text) {
            document.getElementById('update-time').innerText = text;
        }

        function loadData(isManual) {
            const btn = document.getElementById('refresh-btn');
            if (isManual) btn.disabled = true;

            // no-cache: 浏览器会发条件请求，文件没变则返回 304，不传正文
            return fetch('cloud_data.json', { cache: 'no-cache' })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    const last = data.times[data.times.length - 1] || '无数据';

                    // 数据没变，跳过重绘
                    if (last === lastTime) {
                        setStatus('最后更新：' + last);
                        return;
                    }

                    lastTime = last;
                    setStatus('最后更新：' + last);
                    renderChart(data);
                })
                .catch(err => {
                    console.error('加载失败:', err);
                    // 只有从未成功加载过时才提示错误；已有数据则静默忽略本次失败
                    if (lastTime === null) {
                        setStatus('数据加载失败：' + err.message);
                    }
                })
                .finally(() => {
                    if (isManual) btn.disabled = false;
                });
        }

        // 递归 setTimeout，配合可见性判断
        function scheduleNext() {
            clearTimeout(pollTimer);
            if (document.hidden) return;              // 后台不排下一轮
            pollTimer = setTimeout(async () => {
                await loadData(false);
                scheduleNext();
            }, REFRESH_INTERVAL);
        }

        // 页面切回前台：立即拉一次并重新排程
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadData(false).finally(scheduleNext);
            } else {
                clearTimeout(pollTimer);
            }
        });

        // 手动刷新
        document.getElementById('refresh-btn').addEventListener('click', () => {
            loadData(true).finally(() => {
                clearTimeout(pollTimer);
                scheduleNext();
            });
        });

        // 首屏加载
        loadData(false).finally(scheduleNext);

        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
