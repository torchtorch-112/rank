<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微博投票实时监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 12px 0 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 700;
            color: #c9d1d9;
            letter-spacing: 0.5px;
        }
        .header h1 span { color: #2ECC71; }
        .status {
            font-size: 12px;
            color: #8b949e;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .status button:hover { background: #30363d; }
        .status button:disabled { opacity: 0.5; cursor: default; }
        #chart {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>微博投票 · <span>实时票数追踪</span></h1>
        <div class="status">
            <span id="update-time">加载中...</span>
            <button id="refresh-btn" type="button">刷新</button>
        </div>
    </div>
    <div id="chart"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

        const COLORS = {
            "十个勤天": "#A29BFE",
            "苏新皓":   "#FF6B6B",
            "朱志鑫":   "#FFD93D",
            "张泽禹":   "#2ECC71"
        };
        const ORDER = ["十个勤天", "苏新皓", "朱志鑫", "张泽禹"];

        const REFRESH_INTERVAL = 1 * 60 * 1000;          // 1 分钟轮询一次
        const WINDOW_MS = 18 * 60 * 60 * 1000;           // ★ 只显示最近 18 小时
        let pollTimer = null;
        let lastTime = null;                             // 上一次渲染的数据时间戳

        function formatVote(v) {
            if (v === null || v === undefined) return '-';
            if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(1) + '亿';
            if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + '万';
            return v.toLocaleString();
        }

        // "2024-05-01 12:30" -> 时间戳（按本地时区解析）
        function parseTime(t) {
            if (t === null || t === undefined) return null;
            const ms = new Date(String(t).replace(' ', 'T')).getTime();
            return isNaN(ms) ? null : ms;
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        function formatTimeLabel(ts, withDate) {
            const d = new Date(ts);
            const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
            if (!withDate) return hm;
            return (d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm;
        }

        function renderChart(data) {
            const rawSeries = data.series || {};
            const rawTimes  = data.times  || [];

            // ---------- 1. 解析时间戳，丢掉无效值，并按时间升序排列 ----------
            const marks = [];
            for (let i = 0; i < rawTimes.length; i++) {
                const ts = parseTime(rawTimes[i]);
                if (ts !== null) marks.push({ ts: ts, idx: i });   // idx 记录原始下标
            }
            marks.sort(function (a, b) { return a.ts - b.ts; });

            if (!marks.length) {
                myChart.clear();
                return;
            }

            // ---------- 2. 以最新一条数据的时间为右边界，向前推 18 小时 ----------
            const endTs   = marks[marks.length - 1].ts;
            const startTs = endTs - WINDOW_MS;

            const visible = marks.filter(function (m) { return m.ts >= startTs; });

            // ---------- 3. 横轴标签是否需要带日期 ----------
            const showDate = new Date(visible[0].ts).toDateString() !==
                             new Date(endTs).toDateString();

            // ---------- 4. 组装 series（[时间戳, 票数] 形式） ----------
            const seriesNames = ORDER.filter(function (n) { return rawSeries[n]; });
            Object.keys(rawSeries).forEach(function (n) {
                if (seriesNames.indexOf(n) === -1) seriesNames.push(n);
            });

            const series = seriesNames.map(function (name) {
                const values = rawSeries[name] || [];
                const pts = visible.map(function (m) {
                    const v = values[m.idx];
                    return [m.ts, (v === null || v === undefined || v === '') ? null : v];
                });
                const color = COLORS[name] || '#4ECDC4';
                return {
                    name: name,
                    type: 'line',
                    smooth: true,
                    symbol: 'none',
                    connectNulls: false,
                    lineStyle: {
                        width: 2.5,
                        color: color,
                        shadowColor: color,
                        shadowBlur: 10
                    },
                    itemStyle: { color: color },
                    emphasis: { focus: 'series' },
                    data: pts
                };
            });

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    axisPointer: { type: 'line', lineStyle: { color: '#30363d' } },
                    formatter: function (params) {
                        if (!params || !params.length) return '';
                        const ts = params[0].axisValue;
                        let html = '<div style="font-size:12px;color:#8b949e">' +
                                   formatTimeLabel(ts, true) + '</div>';
                        params.forEach(function (p) {
                            const v = Array.isArray(p.value) ? p.value[1] : p.value;
                            html += '<div style="margin-top:4px">' +
                                '<span style="display:inline-block;width:8px;height:8px;' +
                                'border-radius:50%;background:' + p.color +
                                ';margin-right:6px;"></span>' +
                                p.seriesName + ': <b>' + formatVote(v) + '</b></div>';
                        });
                        return html;
                    }
                },
                legend: {
                    data: seriesNames,
                    textStyle: { color: '#c9d1d9', fontSize: 12 },
                    top: 0,
                    icon: 'circle'
                },
                grid: {
                    left: '8%',
                    right: '5%',
                    bottom: '10%',
                    top: 50,
                    containLabel: true
                },
                xAxis: {
                    type: 'time',
                    min: startTs,        // ★ 左边界：最新数据时间 - 18h
                    max: endTs,          // ★ 右边界：最新数据时间
                    boundaryGap: false,
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        hideOverlap: true,
                        formatter: function (value) {
                            return formatTimeLabel(value, showDate);
                        }
                    },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisTick: { show: false },
                    splitLine: { show: false }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        formatter: formatVote
                    },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: {
                        lineStyle: { color: '#30363d', type: 'dashed' }
                    }
                },
                series: series,
                animationDuration: 500
            };

            myChart.setOption(option, true);
        }

        function setStatus(text) {
            document.getElementById('update-time').innerText = text;
        }

        function loadData(isManual) {
            const btn = document.getElementById('refresh-btn');
            if (isManual) btn.disabled = true;

            // no-cache: 浏览器会发条件请求，文件没变则返回 304，不传正文
            return fetch('cloud_data.json', { cache: 'no-cache' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    const times = data.times || [];
                    const last = times[times.length - 1] || '无数据';

                    // 数据没变，跳过重绘
                    if (last === lastTime) {
                        setStatus('最后更新：' + last);
                        return;
                    }

                    lastTime = last;
                    setStatus('最后更新：' + last);
                    renderChart(data);
                })
                .catch(function (err) {
                    console.error('加载失败:', err);
                    // 只有从未成功加载过时才提示错误；已有数据则静默忽略本次失败
                    if (lastTime === null) {
                        setStatus('数据加载失败：' + err.message);
                    }
                })
                .finally(function () {
                    if (isManual) btn.disabled = false;
                });
        }

        // 递归 setTimeout，配合可见性判断
        function scheduleNext() {
            clearTimeout(pollTimer);
            if (document.hidden) return;              // 后台不排下一轮
            pollTimer = setTimeout(async function () {
                await loadData(false);
                scheduleNext();
            }, REFRESH_INTERVAL);
        }

        // 页面切回前台：立即拉一次并重新排程
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                loadData(false).finally(scheduleNext);
            } else {
                clearTimeout(pollTimer);
            }
        });

        // 手动刷新
        document.getElementById('refresh-btn').addEventListener('click', function () {
            loadData(true).finally(function () {
                clearTimeout(pollTimer);
                scheduleNext();
            });
        });

        // 首屏加载
        loadData(false).finally(scheduleNext);

        window.addEventListener('resize', function () { myChart.resize(); });
    </script>
</body>
</html>
