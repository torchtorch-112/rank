<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微博投票实时监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 12px 0 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 700;
            color: #c9d1d9;
            letter-spacing: 0.5px;
        }
        .header h1 span { color: #2ECC71; }
        .status {
            font-size: 12px;
            color: #8b949e;
            margin-top: 6px;
        }
        #chart {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>微博投票 · <span>实时票数追踪</span></h1>
        <div class="status" id="update-time">加载中...</div>
    </div>
    <div id="chart"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

        const COLORS = {
            "十个勤天": "#A29BFE",
            "苏新皓":   "#FF6B6B",
            "朱志鑫":   "#FFD93D",
            "张泽禹":   "#2ECC71"
        };
        const ORDER = ["十个勤天", "苏新皓", "朱志鑫", "张泽禹"];

        function formatVote(v) {
            if (v === null || v === undefined) return '-';
            if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(1) + '亿';
            if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + '万';
            return v.toLocaleString();
        }

        function renderChart(data) {
            // 只显示 HH:MM
            const times = data.times.map(t => String(t).substring(11, 16));

            // 按固定顺序取数据
            const seriesNames = ORDER.filter(n => data.series[n]);
            // 加上不在 ORDER 里的
            Object.keys(data.series).forEach(n => {
                if (!seriesNames.includes(n)) seriesNames.push(n);
            });

            const series = seriesNames.map(name => ({
                name: name,
                type: 'line',
                smooth: true,
                symbol: 'none',
                connectNulls: false,
                lineStyle: {
                    width: 2.5,
                    color: COLORS[name] || '#4ECDC4',
                    shadowColor: COLORS[name] || '#4ECDC4',
                    shadowBlur: 10
                },
                itemStyle: { color: COLORS[name] || '#4ECDC4' },
                emphasis: { focus: 'series' },
                data: data.series[name]
            }));

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    formatter: function (params) {
                        let html = '<div style="font-size:12px">' + params[0].axisValue + '</div>';
                        params.forEach(p => {
                            html += `<div style="margin-top:4px">
                                <span style="display:inline-block;width:8px;height:8px;
                                border-radius:50%;background:${p.color};
                                margin-right:6px;"></span>
                                ${p.seriesName}: <b>${formatVote(p.value)}</b>
                            </div>`;
                        });
                        return html;
                    }
                },
                legend: {
                    data: seriesNames,
                    textStyle: { color: '#c9d1d9', fontSize: 12 },
                    top: 0,
                    icon: 'circle'
                },
                grid: {
                    left: '8%',
                    right: '5%',
                    bottom: '10%',
                    top: 50,
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: times,
                    axisLabel: { color: '#8b949e', fontSize: 10 },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisTick: { show: false }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#8b949e',
                        fontSize: 10,
                        formatter: formatVote
                    },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: {
                        lineStyle: { color: '#30363d', type: 'dashed' }
                    }
                },
                series: series,
                animationDuration: 500
            };

            myChart.setOption(option, true);
        }

        function loadData() {
            fetch('cloud_data.json?t=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    const last = data.times[data.times.length - 1] || '无数据';
                    document.getElementById('update-time').innerText =
                        '最后更新：' + last + ' ｜ 每 5分钟 自动刷新';
                    renderChart(data);
                })
                .catch(err => {
                    console.error('加载失败:', err);
                    document.getElementById('update-time').innerText =
                        '数据加载失败：' + err.message;
                });
        }

        loadData();
        setInterval(loadData, 60000);

        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
